    <body>
        <h2>Study Marathon Admin Panel</h2>
        <div class="nav">
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="lessons.html">Lessons</a>
            <a href="books.html">Books</a>
            <a href="quiz.html">Quiz</a>
            <a href="chat.html">Chat</a>
        </div>

        <div class="admin-container">
            <h3>Add New Book</h3>
            <div class="form-group">
                <input id="bookTitle" placeholder="Book title" required>
               <button><input class="input-btn" id="bookFile" type="file" accept=".pdf" required>insert book</button>
                <input id="videoLink" placeholder="YouTube link">
                <button onclick="addBookViaAPI()">Add Book</button>
            </div>

            <h3>Add New Lesson</h3>
            <div class="form-group">
                <input id="lessonTitle" placeholder="Lesson title" required>
                <input id="zoomLink" placeholder="Zoom link" required>
                <input id="startTime" type="datetime-local" required>
                <input id="endTime" type="datetime-local" required>
                <button onclick="addLessonViaAPI()">Add Lesson</button>
            </div>

            <h3>Add Quiz Question</h3>
            <div class="form-group">
                <input id="question" placeholder="Question" required>
                <input id="a" placeholder="Option A" required>
                <input id="b" placeholder="Option B" required>
                <input id="c" placeholder="Option C" required>
                <input id="correct" placeholder="Correct answer (a/b/c)" required>
                <button onclick="addQuizViaAPI()">Add Quiz</button>
            </div>

            <h3>Manage Content</h3>
            <div class="management-section">
                <button onclick="loadBooks()">Load Books</button>
                <div id="booksList"></div>

                <button onclick="loadLessons()">Load Lessons</button>
                <div id="lessonsList"></div>

                <button onclick="loadQuiz()">Load Quiz</button>
                <div id="quizList"></div>

                <button onclick="loadUsers()">Load Users</button>
                <div id="usersList"></div>

                <button onclick="loadMessages()">Load Chat Messages</button>
                <div id="messagesList"></div>
            </div>
        </div>
